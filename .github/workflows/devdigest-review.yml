name: DevDigest Review
on:
  pull_request:
    types:
      - opened
      - synchronize
permissions:
  contents: read
  pull-requests: write
jobs:
  devdigest-review:
    name: DevDigest Review
    runs-on:
      - self-hosted
      - devdigest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run DevDigest Review
        run: node .devdigest/runner/index.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_POST_AS: github_review
          DEVDIGEST_DIR: ${{ github.workspace }}/.devdigest
          DEVDIGEST_RESULT_PATH: devdigest-result.json
      - name: Upload DevDigest Result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devdigest-result
          path: devdigest-result.json
          if-no-files-found: warn
      - name: Ingest result into DevDigest Studio
        if: always()
        env:
          DEVDIGEST_STUDIO_URL: ${{ vars.DEVDIGEST_STUDIO_URL }}
          CI_INGEST_TOKEN: ${{ secrets.CI_INGEST_TOKEN }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |-
          if [ -z "$DEVDIGEST_STUDIO_URL" ]; then
            echo "DEVDIGEST_STUDIO_URL not set; skipping ingest."
            exit 0
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found; skipping ingest."
            exit 0
          fi
          PAYLOAD="$(jq -c --arg repo "$PR_REPOSITORY" --arg sha "$PR_HEAD_SHA" '. + {repository: $repo, commit_sha: $sha}' devdigest-result.json 2>/dev/null || echo "")"
          if [ -z "$PAYLOAD" ]; then
            echo "Could not build ingest payload; skipping."
            exit 0
          fi
          curl -s -X POST "$DEVDIGEST_STUDIO_URL/ci/ingest" \
            -H "Authorization: Bearer $CI_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            || true
